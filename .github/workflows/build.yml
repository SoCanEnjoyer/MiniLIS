name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller customtkinter fpdf2
      - run: pyinstaller --onefile --windowed --collect-all customtkinter --name="CoreLIS_Pro" lis_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CoreLIS-Pro-Windows
          path: dist/CoreLIS_Pro.exe
