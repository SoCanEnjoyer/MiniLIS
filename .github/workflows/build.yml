name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller customtkinter fpdf2
      - run: pyinstaller --onefile --windowed --collect-all customtkinter --name="Monocytes_Delegates_LIS_v5" lis_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Monocytes-Delegates-LIS-v5-Windows
          path: dist/Monocytes_Delegates_LIS_v5.exe
